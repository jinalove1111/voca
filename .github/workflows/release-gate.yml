# Release Gate — 학생/기능 회귀가 배포되지 않도록 막는 검증 워크플로
#
# 목적
#   "학생 데이터나 기존에 잘 작동하는 기능을 깨뜨리는 변경이 배포되지 않게 한다."
#   npm run verify:release 가 실패하면 이후 단계(deploy-ready)로 절대 진행되지
#   않는다(needs: 체인).
#
# ─────────────────────────────────────────────────────────────────────────────
# ★ 반드시 알아야 할 한계 — 이 워크플로만으로는 Vercel 배포가 막히지 않는다 ★
#
#   이 저장소의 실제 배포는 "GitHub main push -> Vercel 자동 배포"다
#   (PROJECT_GUIDE.md 14행, handoff.md 887행: vercel.json 없음, 빌드 훅 없음,
#    push = Vercel 코드 배포만). Vercel 은 Git 연동으로 push 를 직접 감시하므로
#   GitHub Actions 가 빨간불이어도 배포를 시작한다.
#
#   따라서 이 워크플로가 "차단"으로 작동하려면 아래 둘 중 하나가 필요하다.
#
#   (A) 권장 — main 브랜치 보호 규칙 (GitHub 저장소 설정, 코드로 못 바꿈)
#       Settings > Branches > Add branch protection rule (main)
#         · Require a pull request before merging      체크
#         · Require status checks to pass before merging 체크
#             -> 필수 체크로 "release-gate" 와 "deploy-ready" 선택
#       이러면 게이트가 실패한 변경은 main 에 병합되지 못하고, 병합이 없으면
#       Vercel 을 깨우는 push 자체가 발생하지 않는다 = 실질적 배포 차단.
#       ※ 지금처럼 main 에 직접 push 하는 방식(git push origin <sha>:main)은
#          보호 규칙이 켜지면 거부된다 — PR 경유로 바꿔야 한다.
#
#   (B) 보조 — Vercel Ignored Build Step (Vercel 프로젝트 설정)
#       Settings > Git > Ignored Build Step 에 검증 명령을 넣는다.
#       주의: exit code 의미가 반대다(0 = 빌드 건너뜀, 1 = 빌드 진행).
#       또 Vercel 빌드 컨테이너에서 verify:all 이 매번 도는 비용이 붙는다.
#       (A)로 충분하면 생략을 권한다.
#
#   이 파일은 (A)/(B) 어느 설정도 자동으로 바꾸지 않는다 — 운영자 판단 사항이다.
# ─────────────────────────────────────────────────────────────────────────────
#
# 기존 워크플로 무변경
#   .github/workflows/deploy.yml(GitHub Pages, workflow_dispatch 수동 전용,
#   2026-07-24 그림자 배포 사고로 비활성)은 한 줄도 건드리지 않는다.
#   이 파일은 완전히 독립된 별도 워크플로다.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions)
#   VITE_SUPABASE_URL        Gate 3(학생 헬스체크) 용
#   VITE_SUPABASE_ANON_KEY   〃  — 이미 클라이언트 번들에 실려 배포되는 공개
#                                  키라 노출 위험이 새로 생기지 않는다.
#   시크릿이 없으면 Gate 3 이 --require-env 로 실패한다. "검증 못 함"이 조용한
#   통과가 되지 않게 하려는 의도적 설계다(CLAUDE.md 규칙 18).
#
# 이 워크플로는 DB 에 쓰지 않는다 — 모든 게이트가 SELECT/GET 전용이고,
# 마이그레이션·배포 명령을 포함하지 않는다.

name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 읽기 전용 권한만 — 이 워크플로는 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

# 같은 브랜치의 이전 실행은 취소해 러너 낭비를 막는다.
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release Gate (build + verify:all + student health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 일부 검증 스크립트는 자격증명을 process.env 가 아니라 .env "파일"에서
      # 직접 읽는다(예: scripts/testStudentSelectPinStatus.mjs 의
      # fs.readFileSync('.env')). .env 는 .gitignore 대상이라 체크아웃에 없으므로
      # secrets 로 같은 파일을 만들어 준다 — 스크립트는 한 줄도 고치지 않는다.
      # anon 키는 이미 클라이언트 번들에 실려 배포되는 공개 키다.
      # ADMIN_PIN 은 여기에 쓰지 않는다(공개 저장소 secret 미등록, 운영자 결정
      # 2026-08-27 옵션 B) — 그 결과 PIN 인증 e2e 4종은 CI 에서 정직하게 SKIP 된다.
      - name: Create .env from secrets (anon key only — no ADMIN_PIN)
        run: |
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env
          printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY" >> .env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 진단 정보 ─────────────────────────────────────────────────────────
      # 로컬(Windows/Node 24)과 CI(ubuntu/Node 20)의 차이로 생기는 실패를
      # 빠르게 구분하기 위해 환경을 먼저 찍는다.
      - name: Environment info
        shell: bash
        run: |
          echo "node   $(node --version)"
          echo "npm    $(npm --version)"
          echo "os     $(uname -a)"
          echo ".env   $([ -f .env ] && echo present || echo MISSING)"
          echo ".env.local $([ -f .env.local ] && echo present || echo 'absent (정상 — ADMIN_PIN 미주입)')"

      # ── 게이트 3단계 분리 ─────────────────────────────────────────────────
      # 한 단계로 묶으면 실패 시 "npm run verify:release 실패"만 남아 어느
      # 게이트인지 알 수 없다(run 33041427809 에서 실제로 겪었다 — 27초 만에
      # 죽었는데 build/verify:all/health 중 무엇인지 특정 불가).
      #
      # 또 Actions 로그 다운로드는 인증이 필요해 API 로 못 읽는 반면(403),
      # annotation 은 공개 API 로 읽힌다. 그래서 각 게이트가 실패하면 출력
      # 꼬리를 ::error:: annotation 으로 띄워 로그 없이도 원인이 보이게 한다.
      #
      # set -o pipefail — `| tee` 때문에 실패 종료코드가 삼켜지는 것을 막는다.

      - name: Gate 1 — npm run build
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee /tmp/gate1.log; then
            echo "::error title=Gate 1 (build) 실패::$(tail -n 30 /tmp/gate1.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Gate 2 — npm run verify:all (기존 도메인 회귀)
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if ! npm run verify:all 2>&1 | tee /tmp/gate2.log; then
            echo "::error title=Gate 2 (verify:all) 실패::$(grep -E '^  FAIL' /tmp/gate2.log | tail -n 20 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gate 2 출력 꼬리::$(tail -n 30 /tmp/gate2.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      # Gate 3 은 baseline(scripts/health/baseline.json) 대비 "새로 생긴 FAIL"만
      # 회귀로 보고 차단한다. 이미 알던 문제는 계속 표시되지만 막지 않는다 —
      # 게이트가 늘 빨간불이라 무시당하는 실패 모드를 구조적으로 방지한다.
      #
      # 검사 내용(학생당 19개 체크 -> 9개 FAIL 코드):
      #   로그인 식별자 / 홈 반·교재 소유 반 유효성 / 주교재 연결 /
      #   교재-유닛 연결 / current_unit 유효성 / 단어 0개 / 유령 유닛 /
      #   쓰기 방향 리졸버 / 중복 계정 / 배정 고아
      #
      # --skip-build --skip-verify: Gate 1·2 를 위에서 이미 돌렸으므로 중복
      # 실행하지 않는다. 판정 로직(baseline diff)은 verify:release 그대로 재사용.
      - name: Gate 3 — student health (baseline 대비 회귀)
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if ! npm run verify:release -- --skip-build --skip-verify 2>&1 | tee /tmp/gate3.log; then
            echo "::error title=Gate 3 (student health) 실패::$(tail -n 40 /tmp/gate3.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  # release-gate 가 실패하면 needs 조건이 성립하지 않아 이 잡은 아예 실행되지
  # 않는다 = "이후 배포 단계로 절대 진행되지 않는다". 브랜치 보호에서 필수
  # 체크로 지정하면 병합 자체가 막힌다(위 (A) 참고).
  deploy-ready:
    name: Deploy Ready
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 게이트 통과 확인
        run: |
          echo "Release Gate 통과 — 이 커밋은 배포 가능 상태입니다."
          echo "  Gate 1  build"
          echo "  Gate 2  verify:all (기존 도메인 회귀)"
          echo "  Gate 3  student health (학생별 silent regression, baseline 대비)"
          echo ""
          echo "주의: 이 잡은 배포를 수행하지 않습니다. 실제 배포는 main push ->"
          echo "Vercel 자동 배포이며, 그것을 막으려면 main 브랜치 보호 규칙에서"
          echo "이 체크를 required 로 지정해야 합니다(파일 상단 주석 (A) 참고)."
